[project]
name = "devwatch"
version = "0.2.0"
description = "Background file-change watcher managed as a user systemd service."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
devwatch = "devwatch.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
